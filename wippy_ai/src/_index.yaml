version: "1.0"
namespace: game

entries:
  # HTTP Gateway for Python game communication
  - name: gateway
    kind: http.service
    addr: ":8080"
    lifecycle:
      auto_start: true

  # Router for AI endpoints
  - name: router
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  # Simple test handler
  - name: test_handler
    kind: function.lua
    source: file://functions/test_handler.lua
    method: handler
    modules:
      - http

  - name: test.endpoint
    kind: http.endpoint
    meta:
      router: game:router
    method: GET
    func: game:test_handler
    path: /test

  # Health endpoint (simplified)
  - name: advisor_health_handler
    kind: function.lua
    source: file://functions/advisor_health.lua
    method: handler
    modules:
      - http

  - name: advisor.health_endpoint
    kind: http.endpoint
    meta:
      router: game:router
    method: GET
    func: game:advisor_health_handler
    path: /advisor/health
